name: RimWorld 1.7 compatibility canary

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-canary
  cancel-in-progress: true

jobs:
  latest-unstable-reference:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Update reference in ephemeral checkout
        run: >-
          dotnet add Source/FavoriteColorDropper/FavoriteColorDropper.csproj
          package Krafs.Rimworld.Ref
          --prerelease
          --framework net10.0
      - name: Build against newest reference
        run: dotnet build Source/FavoriteColorDropper/FavoriteColorDropper.csproj --configuration Release --framework net10.0
      - name: Run contract tests
        run: dotnet test Tests/FavoriteColorDropper.Tests/FavoriteColorDropper.Tests.csproj --configuration Release -p:RimWorldVersion=1.7
