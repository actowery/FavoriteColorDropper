name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore FavoriteColorDropper.slnx --locked-mode
      - name: Build
        run: dotnet build Source/FavoriteColorDropper/FavoriteColorDropper.csproj --configuration Release --no-restore
      - name: Test RimWorld 1.6
        run: dotnet test Tests/FavoriteColorDropper.Tests/FavoriteColorDropper.Tests.csproj --configuration Release --no-restore -p:RimWorldVersion=1.6
      - name: Test RimWorld 1.7
        run: dotnet test Tests/FavoriteColorDropper.Tests/FavoriteColorDropper.Tests.csproj --configuration Release --no-restore -p:RimWorldVersion=1.7
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          outputs/FavoriteColorDropper.zip
          outputs/FavoriteColorDropper.zip.sha256
          --verify-tag
          --generate-notes
          --title "Favorite Color Dropper ${{ github.ref_name }}"

